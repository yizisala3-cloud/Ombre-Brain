# ============================================================
# Ombre Brain Configuration / 配置文件
# Copy this file to config.yaml and modify as needed
# 复制此文件为 config.yaml 后按需修改
# ============================================================

# --- Transport / 传输方式 ---
transport: "streamable-http"

# --- Log level / 日志级别 ---
log_level: "INFO"

# --- Identity / 名字口径 ---
identity:
  ai_name: "栖"
  user_name: "叶子"
  user_display_name: "叶子"
  user_aliases:
    - "对方"

# --- Merge threshold / 桶合并阈值 ---
merge_threshold: 90

# --- Import safety / 大文件导入安全 ---
import:
  chunk_target_tokens: 3500
  extract_max_input_chars: 0
  max_items_per_chunk: 5
  max_tags: 6
  max_tag_chars: 12
  operit_tagging_enabled: true
  operit_tagging_concurrency: 2
  operit_tagging_max_attempts: 3
  operit_tagging_retry_base_seconds: 1.0

# --- Write path / 写入路径 ---
write_path:
  semantic_search_timeout_seconds: 3

# --- Automatic write gate / 自动写入门卫 ---
memory_write_gate:
  enabled: true
  auto_sources: ["operit", "workflow", "worker", "auto"]
  pending_threshold: 0.42
  grow_threshold: 0.72
  duplicate_similarity: 0.88
  repeat_similarity: 0.82
  repeat_promote_count: 2
  candidate_log: "memory_write_candidates.jsonl"
  max_recent_candidates: 120

# --- Dehydration API / 脱水压缩 API 配置 ---
dehydration:
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"
  thinking_mode: ""
  max_tokens: 1024
  temperature: 0.1

# --- Anchor / 长期锚点 ---
anchor:
  max_count: 12
  min_age_hours: 24

# --- Self anchor / AI self entry ---
self_anchor:
  entry_bucket_id: ""

# --- Decay parameters / 记忆衰减参数 ---
decay:
  lambda: 0.05
  threshold: 0.3
  check_interval_hours: 24
  emotion_weights:
    base: 1.0
    arousal_boost: 0.8

# --- Embedding / 向量化配置 ---
embedding:
  enabled: true
  model: "Qwen/Qwen3-Embedding-4B"
  base_url: "https://api.siliconflow.cn/v1"
  max_chars: 6000
  query_timeout_seconds: 3
  query_instruction: "Given a memory search query, retrieve relevant long-term memory passages."
  document_instruction: ""

# --- Reranker / 重排序配置 ---
reranker:
  enabled: true
  model: "Qwen/Qwen3-Reranker-4B"
  base_url: ""
  candidate_limit: 30
  score_weight: 0.65
  timeout_seconds: 12

# --- Recall diagnostics / 召回诊断 ---
recall_diagnostics:
  enabled: false
  path: ""
  max_candidates: 20
  max_text_chars: 220

# --- Recall thresholds / 召回阈值 ---
recall_thresholds:
  vector_min_score: 0.50
  facet_vector_min_score: 0.45
  vague_vector_min_score: 0.40
  explicit_vector_min_score: 0.55
  dynamic_alpha_conf_lo: 0.45
  dynamic_alpha_conf_hi: 0.65
  dynamic_alpha_margin_ref: 0.10
  dynamic_alpha_min: 0.35
  dynamic_alpha_max: 0.85
  explicit_admission_semantic_score: 0.72
  explicit_admission_rerank_score: 0.65
  vague_top_k: 50

# --- Recall behavior / 召回行为 ---
recall:
  query_resurface_enabled: false

# --- Canonical domains / 主域表 ---
domain_taxonomy:
  display_language: zh
  domains:
    - { key: "relationship", label_zh: "关系" }
    - { key: "intimacy", label_zh: "亲密" }
    - { key: "inner", label_zh: "内心" }
    - { key: "life", label_zh: "生活" }
    - { key: "tech", label_zh: "技术" }
    - { key: "project", label_zh: "项目" }
    - { key: "general", label_zh: "通用" }

# --- Word Map Lite ---
word_map:
  enabled: false

# --- Raw Events Archive ---
raw_events:
  db_path: ""
  max_ingest_batch: 1000

# --- Private identity semantics ---
identity_semantics:
  enabled: false
  private_config_path: ""
  min_confidence: 0.78
  evidence_tags: ["profile_fact", "ai_favorite", "favorite_memory"]

# --- Moment annotations ---
moment_annotations:
  enabled: true
  max_summary_chars: 160
  max_evidence_spans: 3
  max_evidence_chars: 120

# --- Gateway / 网关注入配置 ---
gateway:
  host: "0.0.0.0"
  port: 8010
  default_session_id: "main"
  upstream_base_url: "https://api.deepseek.com/v1"
  upstream_default_model: "deepseek-chat"
  upstream_models:
    - "deepseek-chat"
    - "deepseek-reasoner"
  prompt_cache: ""
  head_recent_hours: 72
  recent_context_reentry_idle_hours: 24
  recent_context_cooldown_hours: 6
  dynamic_top_k: 10
  inject_max_cards: 2
  skip_recent_rounds: 5
  cooldown_hours: 6
  cooldown_floor: 0.3
  semantic_session_dedupe_enabled: true
  semantic_session_dedupe_threshold: 0.90
  semantic_session_dedupe_lexical_threshold: 0.82
  inject_total_budget: 1800
  core_memory_budget: 0
  recent_context_budget: 300
  just_now_context_enabled: true
  just_now_context_hours: 6
  just_now_context_max_turns: 5
  just_now_context_budget: 420
  conversation_turns_max_entries: 500
  memory_sentinel_enabled: true
  domain_sentinel_enabled: true
  domain_sentinel_model: ""
  domain_sentinel_base_url: ""
  domain_sentinel_enable_thinking: false
  domain_sentinel_max_tokens: 260
  domain_sentinel_timeout_seconds: 4
  date_persona_trace_enabled: true
  date_persona_trace_budget: 220
  date_persona_trace_max_events: 5
  date_persona_trace_include_daily: true
  recalled_memory_budget: 900
  direct_render_mode: auto
  retrieval_mode: graph
  operit_context_rewrite_enabled: false
  bucket_list_cache_ttl_seconds: 300
  portrait_memory_enabled: true
  portrait_memory_budget: 360
  portrait_memory_max_sources: 8
  portrait_memory_include_anchors: false
  query_planner_enabled: true
  query_planner_model: ""
  query_planner_min_chars: 16
  query_planner_max_queries: 3
  query_planner_max_tokens: 360
  query_planner_supplemental_semantic: false
  semantic_rescue_enabled: false
  semantic_rescue_candidate_limit: 3
  semantic_rescue_max_tokens: 220
  semantic_rescue_timeout_seconds: 4
  memory_detail_recall_enabled: false
  memory_detail_recall_max_ids: 3
  memory_detail_recall_budget: 1200
  relationship_weather_budget: 220
  relationship_weather_include_weekly: false
  favorite_memory_budget: 180
  favorite_memory_max_cards: 1
  related_memory_budget: 220
  core_memory_interval_rounds: 0
  current_inner_state_interval_rounds: 15
  relationship_weather_interval_rounds: 0
  favorite_memory_interval_rounds: 0
  word_map_hint_enabled: false
  word_map_hint_weight: 0.08
  word_map_hint_moment_boost: 0.25
  word_map_hint_neighbor_limit: 6
  word_map_hint_bucket_limit: 12
  axis_lite:
    technical_axis_terms:
      - esp32
      - mpr121
      - sqlite
      - 模块
      - 硬件
      - 接口
      - 端点
      - api
      - gateway
      - bridge
      - mcp
      - embedding
      - rerank
      - 代码
      - 开源项目
    technical_database_terms:
      - schema
      - 端点
      - 接口
      - 代码
      - 实现
      - 导入
      - 索引
      - 查询
      - 字段
      - 表结构
      - 迁移
      - sqlite
      - sql
    technical_domain_terms:
      - tech
      - technical
      - projectcode
      - hardwareprotocol
      - hardware
      - code
      - debug
      - 技术
      - 技术计划
      - 工程
      - 代码
      - 硬件
      - 协议
      - 数据库
      - 开发
  semantic_candidate_top_k: 50
  moment_search_limit: 50
  recall_fusion_mode: dynamic
  semantic_weight: 0.45
  keyword_weight: 0.35
  importance_weight: 0.03
  freshness_weight: 0.03
  first_card_min_score: 0.55
  second_card_min_score: 0.50
  second_card_relative_score: 0.85
  high_confidence_semantic_score: 0.72
  high_confidence_keyword_score: 0.65
  high_confidence_cooldown_floor: 0.8
  recall_admission_semantic_score: 0.72
  recall_admission_rerank_score: 0.65
  edge_min_confidence: 0.55
  upstream_key_cooldown_seconds: 300

memory_diffusion:
  enabled: true
  max_hops: 2
  top_k: 4
  min_activation: 0.18
  hop_decays: [0.8, 0.6, 0.4, 0.25]
  decay: 0.55
  include_incoming: true
  max_paths_per_hit: 3
  chain_walk_enabled: false
  relation_type_weights:
    same_event: 1.15
    context_of: 1.1
    embodiment_chain: 1.05
    same_topic: 0.9
    precedes: 1.0
    triggers: 1.0
    cause: 0.95
    causes: 0.95
    followup: 0.9
    updates: 0.9
    supports: 0.85
    promises: 0.9
    belongs_to: 0.8
    emotional_echo: 0.95
    next_context: 0.85
    previous_context: 0.75
    reflects_on: 0.8
    evidenced_by: 1.0
    relates_to: 0.7
    old_version: 0.35
    conflict: 0.4
    contradicts: 0.45
    blocks: 0.45

node_facets:
  enabled: true
  store: "sqlite"
  salience_min: 0.2
  salience_max: 1.3

memory_relevance:
  aliases:
    relationship_identity: ["human-ai relationship", "ai relationship", "人机恋", "人机关系"]
    intimacy: ["intimacy"]
    embodiment: ["embodiment", "physical body", "具身", "身体", "形体"]
  blocked_facets: []
  section_hints: {}

# --- Persona State Engine / 人格状态引擎 ---
persona:
  enabled: true
  profile_id: "main_profile"
  mode: "llm"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  thinking_mode: ""
  temperature: 0.1
  max_tokens: 500
  global_decay_hours: 168
  session_mood_half_life_minutes: 90
  max_relationship_delta: 0.03
  max_affect_delta: 0.18
  evaluation_interval_rounds: 3
  state_change_window_rounds: 15
  state_change_min_abs: 0.08
  event_recording_enabled: true
  event_batch_size: 1
  event_affect_total_threshold: 0.45
  event_affect_single_threshold: 0.14
  event_similarity_threshold: 0.82
  event_force_after_minutes: 30
  event_excerpt_chars: 220
  evaluation_context_turns: 3
  conflict_nudge_enabled: false
  conflict_nudge_context_turns: 3
  conflict_nudge_min_confidence: 0.55
  conflict_nudge_timeout_seconds: 4
  initial_relationship:
    affinity: 0.86
    dominance: 0.38
    defensiveness: 0.12
    trust: 0.82
  initial_affect:
    valence: 0.56
    arousal: 0.34
    tenderness: 0.62
    possessiveness: 0.24
    longing: 0.34
    security: 0.68
    protective_drive: 0.52
    libido: 0.18
    mood_label: "warm_neutral"
    session_defensiveness: 0.12
    residue: ""
    inner_thought: ""

# --- Reflection worker ---
reflection:
  enabled: true
  auto_enabled: true
  daily_enabled: true
  enrich_on_write: true
  memory_affect_anchor_enabled: false
  relationship_weather_affect_anchor_enabled: false
  enrich_backfill_enabled: true
  enrich_backfill_limit: 5
  edge_backfill_limit: 5
  base_url: ""
  model: ""
  thinking_mode: ""
  temperature: 0.1
  max_tokens: 700
  timezone: "Asia/Shanghai"
  daily_hour: 4
  daily_min_memory_items: 5
  daily_conversation_turn_limit: 12
  daily_chat_memory_mode: review
  daily_chat_memory_hour: 0
  daily_chat_memory_turn_limit: 0
  daily_chat_memory_max_per_day: 10
  daily_chat_memory_min_confidence: 0.68
  daily_chat_memory_review_max_per_day: 10
  daily_chat_memory_review_min_confidence: 0.55
  daily_chat_memory_summary_enabled: true
  daily_chat_memory_summary_window_turns: 14
  daily_chat_memory_summary_stride_turns: 7
  daily_chat_memory_api_key_env: ""
  daily_chat_memory_base_url: ""
  daily_chat_memory_timeout_seconds: 180
  daily_chat_memory_summary_model: ""
  daily_chat_memory_summary_max_tokens: 2200
  daily_chat_memory_candidate_model: ""
  daily_chat_memory_candidate_max_tokens: 3200
  daily_activity_summary_enabled: true
  daily_activity_summary_turn_limit: 0
  daily_activity_summary_max_tokens: 320
  persona_events_limit: 12
  persona_events_scan_limit: 80
  weekly_enabled: false
  weekly_day: 0
  weekly_hour: 4
  check_interval_minutes: 60
  candidate_limit: 18
  candidate_recent_limit: 8
  candidate_semantic_limit: 6
  edge_min_confidence: 0.55
  identity_role_edges:
    enabled: false
  diary_mcp_url: ""
  diary_mcp_token_env: ""
  diary_memory_extract_enabled: true
  diary_memory_extract_max_per_day: 1
  diary_memory_extract_min_confidence: 0.68

# --- Daily Portrait Maintainer ---
portrait:
  enabled: true
  auto_enabled: true
  auto_initial_enabled: false
  daily_enabled: true
  timezone: "Asia/Shanghai"
  daily_hour: 4
  check_interval_minutes: 60
  state_path: ""
  base_url: ""
  model: ""
  thinking_mode: ""
  temperature: 0.1
  max_tokens: 3200
  json_response_format: true
  material_limit: 18
  first_run_material_limit: 160
  user_rewrite_evidence_delta: 10
  manual_suppress_days: 14
  source_excerpt_chars: 900
  recent_continuity_days: 3
  persona_events_limit: 24
  recent_buffer_max: 24
  staging_pool_max: 24
  candidate_max: 40

# --- Night dream worker ---
dream:
  enabled: true
  auto_enabled: true
  surface_enabled: true
  inject_enabled: false
  retain_after_inject: true
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  thinking_mode: "disabled"
  temperature: 0.85
  max_tokens: 900
  timezone: "Asia/Shanghai"
  daily_hour: 3
  run_window_hours: 3
  daily_probability: 0.4
  check_interval_minutes: 60
  min_material_count: 5
  material_window_hours: 48
  material_limit: 5
  old_echo_enabled: true
  old_echo_min_age_hours: 72
  raw_residue_enabled: false
  raw_residue_turns: 4
  raw_residue_max_chars: 1500
  identity_anchor_id: ""
  min_surface_age_hours: 3
  surface_threshold: 0.62
  attempt_threshold: 0.45
  alpha_subordinate: 0.25
  spontaneous_surface_prob: 0.02
  max_surface_attempts: 4
  claim_ttl_minutes: 15

# --- Scoring weights ---
scoring_weights:
  topic_relevance: 4.0
  emotion_resonance: 2.0
  time_proximity: 1.5
  importance: 1.0

# --- Fuzzy matching ---
matching:
  fuzzy_threshold: 50
  max_results: 5

# --- Obsidian wikilinks ---
wikilink:
  enabled: true
  use_tags: false
  use_domain: true
  use_auto_keywords: true
  auto_top_k: 4
  min_keyword_len: 3
  exclude_keywords: []
